<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SS CAREER HUB</title>
<style>
    :root {
        --navy: #0A1F44;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: var(--navy);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
        gap: 70px;
    }

    /* MAIN LOGO TOP */
  .logo-main img {
        height: 200px;
        background: white;
        padding: 25px;
        border-radius: 24px;
        box-shadow: 0 8px 35px rgba(212,175,55,0.4)
    }

    /* 3 PILLARS LOGOS ONLY */
  .logos {
        display:flex;
        justify-content:center;
        align-items:center;
        gap:60px;
        flex-wrap:wrap
    }
  .logos img {
        height:110px;
        background:white;
        padding:18px;
        border-radius:20px;
        box-shadow:0 6px 25px rgba(0,0,0,0.3);
        transition: transform 0.3s;
    }
  .logos img:hover {
        transform: scale(1.1);
    }

    @media(max-width:768px){
      .logo-main img{ height: 140px; padding: 18px; }
      .logos img{ height:85px; padding: 14px; }
      .logos{ gap:35px }
       body{ gap: 50px; }
    }
</style>
</head>
<body>

    <!-- MAIN LOGO -->
    <div class="logo-main">
        <img src="ss%20logo.jpeg" alt="SS Career Hub">
    </div>

    <!-- 3 PILLARS LOGOS ONLY -->
    <div class="logos">
        <img src="campus.jpeg" alt="Campus Infinity">
        <img src="biz.jpeg" alt="Biz Core Infinity">
        <img src="Operational infinity.jpeg" alt="Operational Infinity">
    </div>

</body>
</html>
